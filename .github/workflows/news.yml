name: news
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download calendar
        run: curl -sSfL -A "Mozilla/5.0" https://nfs.faireconomy.media/ff_calendar_thisweek.json -o news.json
      - name: Commit
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "update news" && git push)
